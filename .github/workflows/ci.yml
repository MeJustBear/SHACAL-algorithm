name: CI

on:
  push:
    branches:
      - main
      - master
      - 'dev/**'
  pull_request:
    branches:
      - main
      - master
      - 'dev/**'

jobs:
  # --- Сборка и тесты на Linux/macOS (GCC и Clang) -------------------------
  build-test-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++,     name: ubuntu-gcc }
          - { os: ubuntu-latest, cxx: clang++, name: ubuntu-clang }
          - { os: macos-latest,  cxx: clang++, name: macos-clang }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: shacal_cli-${{ matrix.name }}
          path: build/shacal_cli

  # --- Сборка и тесты на Windows (MSVC) ------------------------------------
  build-test-windows:
    name: windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: shacal_cli-windows-msvc
          path: build/Release/shacal_cli.exe

  # --- Санитайзеры: отдельная конфигурация ASan/UBSan (Этап 4, см. docs) ----
  sanitizers:
    name: ubuntu-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (sanitizers)
        run: cmake -S . -B build-asan -DSHACAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
