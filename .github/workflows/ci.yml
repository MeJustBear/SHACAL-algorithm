name: Build and Test

# Политика запусков:
#   push в dev/**     -> только тесты на всех платформах (без артефактов);
#   pull_request -> main -> тесты на всех платформах + санитайзеры (ASan/UBSan);
#   push в main (в т.ч. после мёржа PR) -> тесты + сборка и публикация
#                        исполняемых файлов для windows, macos, ubuntu-gcc/clang,
#                        а затем автоматический GitHub Release со всеми сборками.
#
# Сборка всё равно нужна для тестов, поэтому различаются лишь условный шаг
# загрузки артефакта и условный job санитайзеров — двойной сборки нет.
#
# Имя релизной сборки: shacal-cli-v<ДД.ММ.ГГ><3 hex-символа sha>_<платформа>,
# например shacal-cli-v20.06.26faf_ubu_clang.

on:
  push:
    branches: [ main, 'dev/**' ]
  pull_request:
    branches: [ main ]

# Основная (неизменяемая) часть имени релизной сборки. Меняется в одном месте.
# Итоговое имя ассета: ${RELEASE_PREFIX}<ДД.ММ.ГГ><sha3>_<платформа>.
env:
  RELEASE_PREFIX: shacal-cli-v

jobs:
  # --- Сборка и тесты на Linux/macOS (GCC и Clang) -------------------------
  build-test-unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++,     name: ubuntu-gcc }
          - { os: ubuntu-latest, cxx: clang++, name: ubuntu-clang }
          - { os: macos-latest,  cxx: clang++, name: macos-clang }
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Артефакт публикуем только при push в main (в т.ч. после мёржа PR).
      # Неявный success() гарантирует, что загрузка идёт лишь при зелёной сборке.
      - name: Upload CLI artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: shacal_cli-${{ matrix.name }}
          path: build/shacal_cli

  # --- Сборка и тесты на Windows (MSVC) ------------------------------------
  build-test-windows:
    name: windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Не фиксируем версию генератора ("Visual Studio 17 2022"): образ раннера
      # обновляет VS, и пин под устаревшую версию даёт ошибку «could not find any
      # instance of Visual Studio». CMake сам выберет установленную VS (нужен
      # многоконфигурационный генератор -> сборка/тесты идут с --config Release).
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload CLI artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: shacal_cli-windows-msvc
          path: build/Release/shacal_cli.exe

  # --- Санитайзеры: при PR в main и при push в main (поймать UB/утечки) ----
  sanitizers:
    name: ubuntu-asan-ubsan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - name: Configure (sanitizers)
        run: cmake -S . -B build-asan -DSHACAL_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # --- Релиз: только при push в main, после успешной сборки/тестов --------
  # Собирает все артефакты платформ, переименовывает по схеме
  # ${RELEASE_PREFIX}<ДД.ММ.ГГ><sha3>_<платформа> и публикует GitHub Release.
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [ build-test-unix, build-test-windows ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write  # нужно для создания релиза и загрузки ассетов
    steps:
      # gh release create обращается к локальному git-репозиторию, поэтому без
      # checkout падает с "fatal: not a git repository". Сам код не нужен —
      # достаточно неглубокого клона (fetch-depth: 1).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble release assets
        id: assemble
        run: |
          set -euo pipefail
          DATE=$(date +%d.%m.%y)          # день релиза: ДД.ММ.ГГ
          SHA3=${GITHUB_SHA:0:3}          # первые 3 символа hex-хеша коммита
          VER="${RELEASE_PREFIX}${DATE}${SHA3}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$VER" >> "$GITHUB_OUTPUT"

          mkdir -p release
          # Соответствие: имя артефакта -> "метка_платформы:файл:расширение".
          map="\
          shacal_cli-ubuntu-gcc|ubu_gcc|shacal_cli|
          shacal_cli-ubuntu-clang|ubu_clang|shacal_cli|
          shacal_cli-macos-clang|mac_clang|shacal_cli|
          shacal_cli-windows-msvc|win_msvc|shacal_cli.exe|.exe"
          while IFS='|' read -r art label src ext; do
            [ -z "$art" ] && continue
            art=$(echo "$art" | xargs)    # обрезать пробелы от отступов YAML
            if [ -f "artifacts/$art/$src" ]; then
              cp "artifacts/$art/$src" "release/${VER}_${label}${ext}"
            else
              echo "::warning::артефакт artifacts/$art/$src не найден, пропущен"
            fi
          done <<< "$map"

          echo "Готовые ассеты релиза:"
          ls -l release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.assemble.outputs.tag }}" \
            release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.assemble.outputs.version }}" \
            --notes "Автоматический релиз из main @ ${GITHUB_SHA}. Платформы: Ubuntu (gcc/clang), macOS (clang), Windows (msvc)."
